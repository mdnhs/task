# One-command local run (npm run dev:all): throwaway services for looking at the whole stack in a browser.
# Own project name and ports, so it never touches docker-compose.dev.yml (5433/6379) or docker-compose.e2e.yml (55432/56379/59000).
# Data lives in named volumes: it survives Ctrl-C and a second `npm run dev:all`; `npm run dev:all:down` removes containers AND volumes.
# Local only: demo data, fake credentials, no live provider. Ports are overridable: LOCAL_PG_PORT, LOCAL_REDIS_PORT, LOCAL_MINIO_PORT, LOCAL_CLAMAV_PORT, LOCAL_WEB_PORT.
name: opsdesk-local
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opsdesk_local
    ports: ["127.0.0.1:${LOCAL_PG_PORT:-54330}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opsdesk_local"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    ports: ["127.0.0.1:${LOCAL_REDIS_PORT:-63790}:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: localminio
      MINIO_ROOT_PASSWORD: localminio-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:${LOCAL_WEB_PORT:-3200}"
    ports: ["127.0.0.1:${LOCAL_MINIO_PORT:-59100}:9000"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
  # Optional and heavy (amd64 image, ~1 GB RAM, 1-2 min to load signatures): off unless LOCAL_CLAMAV=1 (profile `scan`).
  # Without it uploaded files stay "pending": the API has no dev bypass of the scan (it never waves a file through).
  clamav:
    profiles: ["scan"]
    image: clamav/clamav
    platform: linux/amd64
    ports: ["127.0.0.1:${LOCAL_CLAMAV_PORT:-53311}:3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
volumes:
  pgdata:
  redisdata:
  miniodata:
