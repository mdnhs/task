# Throwaway backing services for the Playwright e2e and the real-login smoke (T6.9). Separate project name and ports, so it never
# touches the dev stack. Local only: demo data, fake credentials, no live provider. Start: npm run e2e:stack
name: opsdesk-e2e
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opsdesk_e2e
    ports: ["55432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opsdesk_e2e"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: e2eminio
      MINIO_ROOT_PASSWORD: e2eminio-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3100"
    ports: ["59000:9000"]
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
  clamav:
    image: clamav/clamav
    platform: linux/amd64
    ports: ["53310:3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
