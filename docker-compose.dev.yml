# Local backing services for the API (Postgres, Redis, MinIO, ClamAV, Mailpit). Start: docker compose -f docker-compose.dev.yml up -d --wait
# Demo data: after migrating (see .claude/docs/deploy/demo-seed.md) run
#   ALLOW_DEMO_SEED=1 SEED_DEMO_PASSWORD=<12+ chars> npm -w api run seed:demo
# It refuses a database that holds any tenant outside the three demo tenants, and never runs without ALLOW_DEMO_SEED=1.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opsdesk
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opsdesk"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    # minio/minio was removed from Docker Hub; Chainguard builds the same server
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
  clamav:
    image: clamav/clamav
    platform: linux/amd64
    ports: ["3310:3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
  mailpit:
    image: axllent/mailpit
    ports: ["1026:1025", "8026:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
  miniodata:
