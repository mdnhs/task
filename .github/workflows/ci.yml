name: CI

# The web app (tsc, eslint, vitest, build) is checked by the `check` job in deploy.yml,
# which also gates the Dokploy deploy. This workflow covers the backend and security.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm -w api run typecheck
      # Testcontainers starts Postgres through the Docker daemon on the runner.
      - run: npm -w api test

  # B6 ruling I2: the web's types (lib/api/schema.d.ts) are generated from the API's OpenAPI document. A DTO change without `npm run api:types` fails here.
  contract-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run api:types:check

  # B6 ruling I29: the web clients against the REAL API in process (Testcontainers Postgres, Redis, MinIO through the Docker daemon on the runner).
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:contract

  # B6 T6.9: CR-01..CR-06 as Playwright specs on the REAL stack (web, API, worker, Postgres, Redis, MinIO, ClamAV). Local-style services with fake credentials and the demo seed only.
  # Skeleton parity (project `skeletons`) is run by hand: npm run test:e2e:skeletons.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose -f docker-compose.e2e.yml up -d --wait
      - run: npx playwright test --project=desktop --project=android
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type-checks packages/domain including its *.test.ts files.
      - run: npm -w packages/domain run typecheck

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
